workflows:

  # ─────────────────────────────────────────
  # ANDROID — Google Play Store (.aab)
  # ─────────────────────────────────────────
  android-release:
    name: Academik Android Release
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: 18.19.0
      vars:
        APP_ID: fr.academik.app
        PACKAGE_NAME: fr.academik.app
      android_signing:
        - marketlens_keystore   # Remplacer par academik_keystore après création

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install root dependencies
        script: npm ci

      - name: Build web app (Vite)
        script: npm run build

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Install mobile dependencies
        script: cd mobile && npm ci

      - name: Capacitor sync Android
        script: |
          cd mobile
          npx cap add android || true
          npx cap sync android

      - name: Build Android AAB
        script: |
          cd mobile/android
          ./gradlew bundleRelease

    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
      - mobile/android/app/build/outputs/apk/release/*.apk


  # ─────────────────────────────────────────
  # iOS — App Store (.ipa)
  # ─────────────────────────────────────────
  ios-release:
    name: Academik iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: 18.19.0
      vars:
        APP_ID: fr.academik.app
        BUNDLE_ID: fr.academik.app
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fr.academik.app

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install root dependencies
        script: npm ci

      - name: Build web app (Vite)
        script: npm run build

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Install mobile dependencies
        script: cd mobile && npm ci

      - name: Capacitor sync iOS
        script: |
          cd mobile
          npx cap add ios || true
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd mobile/ios/App
          pod install

      - name: Build iOS IPA
        script: |
          xcode-project use-profiles
          cd mobile
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

