workflows:
  academik-ios-ipa:
    name: Academik iOS signed IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: artifacts/academik-mobile

    integrations:
      # This must match the App Store Connect API key name saved in Codemagic.
      app_store_connect: Academik App Store Connect

    environment:
      node: v22.11.0
      xcode: latest
      cocoapods: default
      groups:
        # Create this Codemagic variable group and add
        # EXPO_PUBLIC_REVENUECAT_IOS_API_KEY to it.
        - academik_mobile
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.replit.academik
      vars:
        EXPO_PUBLIC_DOMAIN: academik.fr
        XCODE_SCHEME: Academik

    scripts:
      - name: Install workspace dependencies
        script: |
          npm exec --yes --package=pnpm@10.26.1 -- pnpm --dir "$CM_BUILD_DIR" install --frozen-lockfile

      - name: Generate the iOS project from Expo
        script: npm exec --yes --package=pnpm@10.26.1 -- pnpm --dir "$CM_BUILD_DIR/artifacts/academik-mobile" exec expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        script: cd ios && pod install

      - name: Set up Apple distribution signing
        script: xcode-project use-profiles --project "ios/Academik.xcodeproj"

      - name: Set a new iOS build number
        script: |
          test -n "$PROJECT_BUILD_NUMBER"
          cd ios
          agvtool new-version -all "$((PROJECT_BUILD_NUMBER + 1))"

      - name: Build the signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/artifacts/academik-mobile/ios/Academik.xcworkspace" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        # Upload the signed IPA using the Apple integration configured above.
        # Upload only: do not submit for review or release the app.
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  academik-android-aab:
    name: Academik Android signed AAB
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: artifacts/academik-mobile

    environment:
      node: v22.11.0
      java: 17
      groups:
        # Set ANDROID_VERSION_CODE and EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY
        # in this Codemagic group. See docs/codemagic-android.md.
        - Acadamik_Android
        # Reuse the password that generated the replacement JKS.
        - academik_key_recovery
      vars:
        EXPO_PUBLIC_DOMAIN: academik.fr
        CI: "true"

    scripts:
      - name: Restore and check the Android upload key
        script: |
          set -eu
          cd "$CM_BUILD_DIR/artifacts/academik-mobile"
          node scripts/restore-android-keystore.cjs

      - name: Check Android build settings
        script: |
          set -eu
          cd "$CM_BUILD_DIR/artifacts/academik-mobile"
          node scripts/prepare-android-build.cjs validate

      - name: Install workspace dependencies
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          npm exec --yes --package=pnpm@10.26.1 -- pnpm --dir "$CM_BUILD_DIR" install --frozen-lockfile

      - name: Generate the Android project from Expo
        script: |
          set -eu
          cd "$CM_BUILD_DIR/artifacts/academik-mobile"
          npm exec --yes --package=pnpm@10.26.1 -- pnpm exec expo prebuild --platform android --no-install
          node scripts/prepare-android-build.cjs signing

      - name: Build the signed Android App Bundle
        script: |
          set -eu
          cd "$CM_BUILD_DIR/artifacts/academik-mobile/android"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT" || { echo "Android SDK location is missing."; exit 1; }
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Verify and collect the signed AAB
        script: |
          set -eu
          cd "$CM_BUILD_DIR/artifacts/academik-mobile"
          test -s android/app/build/outputs/bundle/release/app-release.aab
          mkdir -p build/android
          jarsigner -J-Duser.language=en -J-Duser.country=US -verify \
            android/app/build/outputs/bundle/release/app-release.aab \
            > build/android/signature-verification.txt 2>&1
          grep -q "jar verified\." build/android/signature-verification.txt || {
            echo "AAB signature verification failed. See signature-verification.txt."
            exit 1
          }
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "build/android/academik-${ANDROID_VERSION_CODE}.aab"

    artifacts:
      - build/android/*.aab
      - build/android/signature-verification.txt
      - android/app/build/outputs/mapping/release/mapping.txt

  academik-generate-upload-key:
    name: Academik - Create Android upload key
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      java: 17
      groups:
        # Add ACADEMIK_UPLOAD_PASSWORD as a Secret in this dedicated group.
        - academik_key_recovery
    scripts:
      - name: Generate upload keystore and public certificate
        script: |
          # No dependencies, existing keystore, Apple integration or app build needed.
          bash "$CM_BUILD_DIR/artifacts/academik-mobile/scripts/generate-upload-key.sh"
    artifacts:
      # The JKS contains a private key: restrict access to build artifacts,
      # download a backup, and never commit it to Git or upload it to Google Play.
      - generated-artifacts/academik-upload-key/academik-upload.jks
      - generated-artifacts/academik-upload-key/upload_certificate.pem
      - generated-artifacts/academik-upload-key/certificate-fingerprints.txt
