workflows:

  # ─────────────────────────────────────────
  # ANDROID — Google Play Store (.aab)
  # ─────────────────────────────────────────
  android-release:
    name: Academik Android Release
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: 20.19.0
      vars:
        APP_ID: fr.academik.app
        PACKAGE_NAME: fr.academik.app
      android_signing:
        - marketlens_keystore

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install root dependencies
        script: npm install

      - name: Install build tools globally
        script: npm install -g vite tsx

      - name: Build web app (Vite)
        script: vite build

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Install mobile dependencies
        script: cd mobile && npm install

      - name: Capacitor sync Android
        script: |
          cd mobile
          npx cap add android || true
          npx cap sync android

      - name: Set targetSdkVersion to 35 and bump versionCode
        script: |
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 35/g' mobile/android/app/build.gradle || true
          sed -i 's/targetSdk = [0-9]*/targetSdk = 35/g' mobile/android/variables.gradle || true
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 35/g' mobile/android/app/build.gradle || true
          sed -i 's/compileSdk = [0-9]*/compileSdk = 35/g' mobile/android/variables.gradle || true
          sed -i 's/versionCode [0-9]*/versionCode 2/g' mobile/android/app/build.gradle || true

      - name: Configure Android signing
        script: |
          cat >> mobile/android/app/build.gradle << 'GRADLE'

          android {
            signingConfigs {
              release {
                storeFile file(System.getenv('CM_KEYSTORE_PATH') ?: '')
                storePassword System.getenv('CM_KEYSTORE_PASSWORD') ?: ''
                keyAlias System.getenv('CM_KEY_ALIAS') ?: ''
                keyPassword System.getenv('CM_KEY_PASSWORD') ?: ''
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE

      - name: Build Android AAB
        script: |
          cd mobile/android
          ./gradlew bundleRelease

    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
      - mobile/android/app/build/outputs/apk/release/*.apk


  # ─────────────────────────────────────────
  # iOS — App Store (.ipa)
  # ─────────────────────────────────────────
  ios-release:
    name: Academik iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: 20.19.0
      vars:
        APP_ID: fr.academik.app
        BUNDLE_ID: fr.academik.app
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fr.academik.app

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install root dependencies
        script: npm install

      - name: Install build tools globally
        script: npm install -g vite tsx

      - name: Build web app (Vite)
        script: vite build

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Install mobile dependencies
        script: cd mobile && npm install

      - name: Capacitor sync iOS
        script: |
          cd mobile
          npx cap add ios || true
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd mobile/ios/App
          pod install

      - name: Build iOS IPA
        script: |
          xcode-project use-profiles
          cd mobile
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
