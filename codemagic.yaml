workflows:

  # ─────────────────────────────────────────
  # ANDROID — Google Play Store (.aab)
  # ─────────────────────────────────────────
  android-release:
    name: Academik Android Release
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: 20.19.0
      vars:
        APP_ID: fr.academik.app
        PACKAGE_NAME: fr.academik.app
      android_signing:
        - marketlens_keystore

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install root dependencies
        script: npm install

      - name: Install build tools globally
        script: npm install -g vite tsx

      - name: Build web app (Vite)
        script: vite build

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Install mobile dependencies
        script: cd mobile && npm install

      - name: Capacitor sync Android
        script: |
          cd mobile
          npx cap add android || true
          npx cap sync android

      - name: Patch Android SDK and versionCode
        script: |
          node -e "
          const fs = require('fs');
          const appGradle = 'mobile/android/app/build.gradle';
          const varsGradle = 'mobile/android/variables.gradle';

          function patchFile(path, replacements) {
            if (!fs.existsSync(path)) { console.log('Not found:', path); return; }
            let content = fs.readFileSync(path, 'utf8');
            console.log('BEFORE', path, ':', content.match(/versionCode \d+|targetSdk\w* \d+|compileSdk\w* \d+/g));
            for (const [from, to] of replacements) {
              content = content.replace(from, to);
            }
            fs.writeFileSync(path, content);
            console.log('AFTER', path, ':', content.match(/versionCode \d+|targetSdk\w* \d+|compileSdk\w* \d+/g));
          }

          patchFile(appGradle, [
            [/versionCode \d+/g, 'versionCode 2'],
            [/targetSdkVersion \d+/g, 'targetSdkVersion 35'],
            [/compileSdkVersion \d+/g, 'compileSdkVersion 35'],
          ]);

          patchFile(varsGradle, [
            [/targetSdkVersion = \d+/g, 'targetSdkVersion = 35'],
            [/compileSdkVersion = \d+/g, 'compileSdkVersion = 35'],
            [/targetSdk = \d+/g, 'targetSdk = 35'],
            [/compileSdk = \d+/g, 'compileSdk = 35'],
          ]);
          "

      - name: Configure Android signing and override SDK/versionCode
        script: |
          cat >> mobile/android/app/build.gradle << 'GRADLE'

          android {
            compileSdkVersion 35
            defaultConfig {
              targetSdkVersion 35
              versionCode System.getenv('BUILD_NUMBER') ? System.getenv('BUILD_NUMBER').toInteger() + 2 : 3
            }
            signingConfigs {
              release {
                storeFile file(System.getenv('CM_KEYSTORE_PATH') ?: '')
                storePassword System.getenv('CM_KEYSTORE_PASSWORD') ?: ''
                keyAlias System.getenv('CM_KEY_ALIAS') ?: ''
                keyPassword System.getenv('CM_KEY_PASSWORD') ?: ''
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE

      - name: Build Android AAB
        script: |
          cd mobile/android
          ./gradlew bundleRelease

    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
      - mobile/android/app/build/outputs/apk/release/*.apk


  # ─────────────────────────────────────────
  # iOS — App Store (.ipa)
  # ─────────────────────────────────────────
  ios-release:
    name: Academik iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: 20.19.0
      vars:
        APP_ID: fr.academik.app
        BUNDLE_ID: fr.academik.app
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
      groups:
        - appstore
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fr.academik.app

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install root dependencies
        script: npm install

      - name: Install build tools globally
        script: npm install -g vite tsx

      - name: Build web app (Vite)
        script: vite build

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Install mobile dependencies
        script: cd mobile && npm install

      - name: Generate app icons
        script: |
          cd mobile
          npm install
          node scripts/generate-icons.js

      - name: Capacitor sync iOS
        script: |
          cd mobile
          npx cap add ios || true
          npx cap sync ios

      - name: Copy icons to Xcode project
        script: |
          ICON_SRC="mobile/resources/ios/AppIcon.appiconset"
          ICON_DST="mobile/ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ -d "$ICON_SRC" ] && [ -d "$ICON_DST" ]; then
            cp -R "$ICON_SRC/." "$ICON_DST/"
            echo "✅ Icons copied to Xcode project"
          else
            echo "⚠️ Icon source or destination not found"
            echo "SRC exists: $([ -d $ICON_SRC ] && echo yes || echo no)"
            echo "DST exists: $([ -d $ICON_DST ] && echo yes || echo no)"
          fi

      - name: Install CocoaPods
        script: |
          cd mobile/ios/App
          pod install

      - name: Set Xcode code signing settings
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          cd mobile
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Logs/gym/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
